<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casamento — Thomaz & Joana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="paper">
    <header class="hero">
      <p class="eyebrow">Convidamos você para celebrar</p>
      <h1>Casamento</h1>
      <p class="names">Thomaz Diniz <span>&</span> Joana</p>
      <p class="tagline" id="tagline">Carregando…</p>
    </header>

    <section class="block" id="when">
      <h2>Quando</h2>
      <p id="datetime">Cerimônia: data e horário a definir.</p>
    </section>

    <section class="block two-col">
      <article>
        <h2>Cerimônia</h2>
        <p class="place" id="church-name"></p>
        <p class="muted" id="church-desc"></p>
        <p class="address" id="church-address"></p>
        <a class="link" id="church-maps" href="#" target="_blank" rel="noopener">Abrir no Google Maps</a>
        <a class="link subtle" id="church-insta" href="#" target="_blank" rel="noopener">Instagram</a>
      </article>
      <article>
        <h2>Recepção</h2>
        <p class="place" id="buffet-name"></p>
        <p class="muted" id="buffet-desc"></p>
        <p class="address" id="buffet-address"></p>
        <a class="link" id="buffet-maps" href="#" target="_blank" rel="noopener">Abrir no Google Maps</a>
        <a class="link subtle" id="buffet-insta" href="#" target="_blank" rel="noopener">Instagram</a>
      </article>
    </section>

    <section class="block gifts">
      <h2>Presentes</h2>
      <p id="gifts-intro"></p>
      <ul id="gifts-list"></ul>
      <p class="muted emphasis" id="gifts-foot"></p>
    </section>

    <section class="block cta">
      <h2>Confirme sua presença</h2>
      <p id="rsvp-text"></p>
      <a class="button" id="rsvp-btn" href="#" target="_blank" rel="noopener">Abrir formulário</a>
    </section>

    <footer class="footer">
      <p>Com carinho, Thomaz e Joana</p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
